system:
  name: SolarHub
  codename: Aurora
  version: 1.0

workflow:
  nightly_time: "00:00 UTC daily"

huggingface:
  # Per-task-type annotation dataset prefix.
  dataset_repo_prefix: SpaceGen/solarhub-
  token_secret: HF_TOKEN

data:
  task_types:
    - sunspot
    - magnetogram
    - aia_94
    - aia_131
    - aia_171
    - aia_193
    - aia_211
    - aia_304
    - aia_335
    - aia_1600
    - aia_1700
    - aia_4500
  source_apis:
    - name: SDO HMI/AIA
      base_url: https://jsoc.stanford.edu/
    - name: NASA SDO
      base_url: https://sdo.gsfc.nasa.gov/
    - name: SOHO LASCO
      base_url: https://soho.nascom.nasa.gov/

annotations:
  merge_strategy: append
  clear_after_merge: true
