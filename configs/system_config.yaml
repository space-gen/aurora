system:
  name: SolarHub Helios
  codename: Aurora
  version: 1.0

ml:
  training_platform: kaggle
  dataset_platform: huggingface

workflow:
  nightly_time: "00:00 UTC"

huggingface:
  # HuggingFace repository / dataset identifiers.
  # The actual API token is supplied at runtime via the HF_TOKEN secret.
  dataset_repo: spacegen/helios-annotations
  model_repo: spacegen/helios-model
  # Name of the GitHub Actions secret that holds the HF write token.
  token_secret: HF_TOKEN

kaggle:
  # Kaggle username and competition / kernel settings.
  # Credentials are supplied at runtime via the KAGGLE_USERNAME and KAGGLE_KEY secrets.
  username_secret: KAGGLE_USERNAME
  key_secret: KAGGLE_KEY
  kernel_name: solarhub-helios-training
  inference_kernel: solarhub-helios-inference
  dataset_title: solarhub-helios-dataset

data:
  task_types:
    - sunspot
    - solar_flare
    - magnetogram
    - coronal_hole
    - prominence
    - active_region
    - cme
  source_apis:
    - name: NASA SDAC
      base_url: https://umbra.nascom.nasa.gov/
    - name: SOHO LASCO
      base_url: https://lasco-www.nrl.navy.mil/
    - name: SDO HMI
      base_url: https://jsoc.stanford.edu/
    - name: NSO
      base_url: https://www.nso.edu/
    - name: SolarMonitor
      base_url: https://www.solarmonitor.org/
    - name: NASA CDAW
      base_url: https://cdaw.gsfc.nasa.gov/

annotations:
  merge_strategy: append
  clear_after_merge: true
