name: "04 · Sync Annotation Templates"

on:
  workflow_run:
    workflows: ["03 · Merge Annotations"]
    types: [completed]
  workflow_dispatch:

jobs:
  sync-annotations:
    name: Copy task templates into annotations/
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync annotation templates from data_processing/
        run: |
          # Copy grouped task files from data_processing/ into annotations/ 
          # so users can find URLs to annotate.
          for src in data_processing/*.json; do
            [ -f "$src" ] || continue
            # Skip model accuracy report if it exists
            [[ "$(basename "$src")" == "model_accuracy.json" ]] && continue
            
            dest="annotations/$(basename "$src")"
            cp "$src" "$dest"
          done
          echo "Annotation templates synced."

      - name: Commit synced annotation templates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add annotations/
          if git diff --cached --quiet; then
            echo "No annotation template changes to commit."
          else
            git commit -m "chore(pipeline): sync annotation templates from data_processing/ [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
          fi
