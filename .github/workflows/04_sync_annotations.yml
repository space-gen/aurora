name: "04 · Sync Annotation Templates"

on:
  
  workflow_run:
    workflows: ["03 · Merge Annotations"]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-annotations:
    name: Copy task templates into annotations/
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync annotation templates from data_processing/
        run: |
          # Copy grouped task files from data_processing/ into annotations/
          # while clearing user-provided labels and locations.
          python -c '
          import json, os, glob
          from pathlib import Path
          
          for src_path in glob.glob("data_processing/*.json"):
              if "model_accuracy.json" in src_path: continue
              
              with open(src_path, "r") as f:
                  data = json.load(f)
              
              # Clear annotation fields for the template
              for record in data:
                  record["user_label"] = None
                  record["locations"] = []
              
              dest_path = Path("annotations") / os.path.basename(src_path)
              with open(dest_path, "w") as f:
                  json.dump(data, f, indent=2)
          '
          echo "Annotation templates synced and cleared."

      - name: Commit synced annotation templates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add annotations/
          if git diff --cached --quiet; then
            echo "No annotation template changes to commit."
          else
            git commit -m "chore(pipeline): sync annotation templates from data_processing/ [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
          fi
