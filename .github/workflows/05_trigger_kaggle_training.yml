name: "05 · Trigger Kaggle Training"

on:
  workflow_run:
    workflows: ["04 · Sync Annotation Templates"]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-training:
    name: Push task data to HuggingFace and trigger Kaggle training kernel
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datasets huggingface_hub kaggle

      - name: Push task data to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/prepare_hf_training_data.py

      - name: Trigger Kaggle training kernels
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Inject secrets
          for task in sunspot magnetogram; do
            sed -i "s|__HF_TOKEN_PLACEHOLDER__|${HF_TOKEN}|g" .github/kaggle/$task/train.py
            sed -i "s|__GH_TOKEN_PLACEHOLDER__|${GH_TOKEN}|g" .github/kaggle/$task/train.py
          done

          # Trigger kernels sequentially to manage Kaggle GPU limits
          # Sunspot
          kaggle kernels push --path .github/kaggle/sunspot/
          echo "Sunspot kernel triggered. Waiting for completion to stay within GPU quota..."
          
          while true; do
            STATUS=$(kaggle kernels status soumyadipkarforma/solarhub-sunspot-training | grep -o "has status \"[^\"]*\"" | cut -d'"' -f2)
            if [ "$STATUS" == "KernelWorkerStatus.COMPLETE" ] || [ "$STATUS" == "KernelWorkerStatus.ERROR" ]; then break; fi
            sleep 60
          done

          # Magnetogram
          kaggle kernels push --path .github/kaggle/magnetogram/
          echo "Magnetogram kernel triggered."
