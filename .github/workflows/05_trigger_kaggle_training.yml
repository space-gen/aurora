name: "05 · Trigger Kaggle Training"

on:
  workflow_run:
    workflows: ["04 · Sync Annotation Templates"]
    types: [completed]
  workflow_dispatch:

jobs:
  trigger-training:
    name: Push task data to HuggingFace and trigger Kaggle training kernel
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datasets huggingface_hub kaggle

      - name: Push task records to HuggingFace
        env:
          # HF_TOKEN is used to push task records to per-task HuggingFace datasets
          # (SpaceGen/solarhub-{task_type}, tasks split) so that Kaggle kernels
          # can pull training/inference data directly from HuggingFace.
          # Set this secret under Settings → Secrets and variables → Actions.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # KAGGLE_USERNAME and KAGGLE_KEY are written to ~/.kaggle/kaggle.json
          # by prepare_hf_training_data.py for the subsequent kernel trigger step.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/prepare_hf_training_data.py

      - name: Trigger Kaggle training kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Write credentials so the kaggle CLI can authenticate.
          mkdir -p ~/.kaggle
          echo '{"username":"'"$KAGGLE_USERNAME"'","key":"'"$KAGGLE_KEY"'"}' \
            > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

          # The training kernel:
          #   1. Reads annotation data from HuggingFace (SpaceGen/solarhub-{task_type}, train split).
          #   2. Trains a model per task type.
          #   3. Pushes trained model weights to HuggingFace (SpaceGen/solarhub-model-{task_type})
          #      using the HF_TOKEN Kaggle Secret configured in the kernel settings.
          kaggle kernels push \
            --path .github/kaggle/training_kernel_metadata.json \
            || echo "Kernel push attempted — check Kaggle for run status."
