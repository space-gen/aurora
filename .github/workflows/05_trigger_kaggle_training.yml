name: "05 · Trigger Kaggle Training"

on:
  workflow_run:
    workflows: ["04 · Sync Annotation Templates"]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-training:
    name: Push task data to HuggingFace and trigger Kaggle training kernel
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datasets huggingface_hub kaggle

      - name: Push task data to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/prepare_hf_training_data.py

      - name: Trigger Kaggle training kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push \
            --path .github/kaggle/training/ \
            || { echo "Kernel push failed"; exit 1; }
          echo "Kernel pushed. Kaggle will trigger the next workflow stage upon completion."
