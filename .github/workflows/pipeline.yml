name: "Nightly Pipeline"

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC daily
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lock:
    name: Stage 01 · Lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rename data/ to data_processing/
        run: |
          if [ -d "data" ]; then
            mv data data_processing
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(pipeline): lock data for processing [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
          fi

  pull:
    name: Stage 02 · Pull URLs (${{ matrix.task }})
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [sunspot, magnetogram]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Pull New URLs (${{ matrix.task }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TASK_TYPE: ${{ matrix.task }}
        run: python scripts/pull_new_urls.py
      - name: Upload Pull Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pull-data-${{ matrix.task }}
          path: data_processing/${{ matrix.task }}.json

  merge-pulls:
    name: Stage 02b · Merge Data
    needs: pull
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: data_processing/
          pattern: pull-data-*
          merge-multiple: true
      - name: Commit all pulled URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_processing/*.json
          git pull origin main --rebase
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(pipeline): merge parallel URL pulls [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi

  push-hf:
    name: Stage 03 · Push to HF (${{ matrix.task }})
    needs: merge-pulls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Push to HuggingFace (${{ matrix.task }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TASK_TYPE: ${{ matrix.task }}
        run: python scripts/merge_annotations_to_hf.py

  sync-and-commit:
    name: Stage 04 · Sync & Commit
    needs: [pull, push-hf]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download All Pull Data
        uses: actions/download-artifact@v4
        with:
          path: data_processing/
          pattern: pull-data-*
          merge-multiple: true
      - name: Reset annotation templates
        run: |
          python -c '
          import json, os, glob
          from pathlib import Path
          for src_path in glob.glob("data_processing/*.json"):
              with open(src_path, "r") as f:
                  data = json.load(f)
              for record in data:
                  record["user_label"] = None
                  record["locations"] = []
              dest_path = Path("annotations") / os.path.basename(src_path)
              with open(dest_path, "w") as f:
                  json.dump(data, f, indent=2)
          '
      - name: Final Consolidated Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git pull origin main --rebase
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(pipeline): update tasks and sync templates [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi

  unlock:
    name: Stage 05 · Unlock
    needs: sync-and-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename data_processing/ back to data/
        run: |
          if [ -d "data_processing" ]; then
            mv data_processing data
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git pull origin main --rebase
            git commit -m "chore(pipeline): unlock system [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi
