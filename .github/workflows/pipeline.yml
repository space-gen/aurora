name: "Nightly Pipeline"
concurrency:
  group: aurora-nightly
  cancel-in-progress: false

on:
  repository_dispatch:
    types: [nightly refresh]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lock:
    name: Stage 01 · Lock Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main for scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare locked snapshot from data branch
        run: |
          git fetch origin data || true
          git checkout origin/data -- data annotations || true

          if [ -d "data" ]; then
            mv data data_processing
          fi
          mkdir -p data_processing annotations

      - name: Upload locked snapshot
        uses: actions/upload-artifact@v4
        with:
          name: locked-state
          path: |
            data_processing/
            annotations/

  pull-urls:
    name: Stage 2 · Pull New URLs
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download locked snapshot
        uses: actions/download-artifact@v4
        with:
          name: locked-state
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests huggingface_hub datasets

      - name: Run Crawler
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pull_new_urls.py

      - name: Upload Pull Results
        uses: actions/upload-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/*.jsonl

  push-annotations:
    name: Stage 3 · Push Annotations to HF
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download locked snapshot
        uses: actions/download-artifact@v4
        with:
          name: locked-state
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests huggingface_hub datasets

      - name: Merge to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/merge_annotations_to_hf.py

      - name: Monthly HF history squash (1st of month)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python scripts/squash_history.py
          else
            echo "Not UTC day 1; skipping monthly HF super-squash."
          fi

  sync-and-unlock:
    name: Stage 04-05 · Sync & Unlock
    needs: [pull-urls, push-annotations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main for scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pulled data
        uses: actions/download-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/

      - name: Build annotations and recreate orphan data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p annotations
          python - <<'PY'
          import glob
          import json
          import os
          import shutil
          from pathlib import Path

          for p in glob.glob("annotations/*"):
              if os.path.basename(p) == "README.md":
                  continue
              if os.path.isfile(p):
                  os.remove(p)
              elif os.path.isdir(p):
                  shutil.rmtree(p)

          for src_path in glob.glob("data_processing/*.jsonl"):
              dest_path = Path("annotations") / os.path.basename(src_path)
              dest_path.parent.mkdir(parents=True, exist_ok=True)
              with open(src_path, "r", encoding="utf-8") as fin, open(dest_path, "w", encoding="utf-8") as fout:
                  for line in fin:
                      if not line.strip():
                          continue
                      record = json.loads(line)
                      ordered_record = {
                          "id": record.get("id"),
                          "url": record.get("url"),
                          "task_type": record.get("task_type"),
                          "created_at": record.get("created_at"),
                          "metadata": record.get("metadata", {}),
                          "annotations": [],
                      }
                      fout.write(json.dumps(ordered_record, separators=(",", ":")) + "\n")
          PY

          rm -rf data
          mv data_processing data

          rm -rf /tmp/data_payload
          mkdir -p /tmp/data_payload
          cp -r data /tmp/data_payload/data
          cp -r annotations /tmp/data_payload/annotations

          git push origin --delete data || true
          git checkout --orphan data_orphan
          git rm -rf --quiet . || true

          mkdir -p data annotations
          cp -r /tmp/data_payload/data/* data/ || true
          cp -r /tmp/data_payload/annotations/* annotations/ || true

          git add -A data annotations
          git commit --allow-empty -m "chore(data): refresh task database and clean templates [skip ci]"
          git push --force origin HEAD:data
