name: "Nightly Pipeline"

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC daily
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lock:
    name: Stage 01 · Lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename data/ to data_processing/ and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -d "data" ]; then
            # Cleanly move to data_processing
            if [ -d "data_processing" ]; then rm -rf data_processing; fi
            mv data data_processing
            
            git add .
            git commit -m "chore(pipeline): lock system for processing [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
            echo "System locked."
          else
            echo "Data folder not found. System already locked."
          fi

  pull:
    name: Stage 02 · Pull URLs (${{ matrix.task }})
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [sunspot, magnetogram]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Pull New URLs (${{ matrix.task }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TASK_TYPE: ${{ matrix.task }}
        run: python scripts/pull_new_urls.py
      - name: Upload Pull Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pull-data-${{ matrix.task }}
          path: data_processing/${{ matrix.task }}.json

  push-hf:
    name: Stage 03 · Push to HF (${{ matrix.task }})
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [sunspot, magnetogram]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Push to HuggingFace (${{ matrix.task }})
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TASK_TYPE: ${{ matrix.task }}
        run: python scripts/merge_annotations_to_hf.py

  sync-and-unlock:
    name: Stage 04-05 · Sync & Unlock
    needs: [pull, push-hf]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download All Pull Data
        uses: actions/download-artifact@v4
        with:
          path: data_processing/
          pattern: pull-data-*
          merge-multiple: true
      - name: Reset annotation templates
        run: |
          python -c '
          import json, os, glob
          from pathlib import Path
          for src_path in glob.glob("data_processing/*.json"):
              with open(src_path, "r") as f:
                  data = json.load(f)
              for record in data:
                  record["user_label"] = None
                  record["locations"] = []
              dest_path = Path("annotations") / os.path.basename(src_path)
              with open(dest_path, "w") as f:
                  json.dump(data, f, indent=2)
          '
      - name: Final Consolidated Unlock & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Sync data back to public folder
          if [ -d "data_processing" ]; then
            rm -rf data
            mv data_processing data
          fi
          
          # 2. Add all changes (data/ and annotations/)
          git add data/ annotations/
          
          # 3. Pull latest changes to avoid conflict
          git pull origin main --rebase
          
          # 4. Commit and Push
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(pipeline): refresh tasks and sync templates [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi
