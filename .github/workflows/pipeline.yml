name: "Nightly Pipeline"

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC daily
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lock:
    name: Stage 01 · Lock Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename data/ to data_processing/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Safety: data/ and data_processing/ must never coexist
          if [ -d "data" ] && [ -d "data_processing" ]; then
            echo "::error::Both data/ and data_processing/ exist simultaneously — inconsistent repository state. Manual intervention required."
            exit 1
          fi

          if [ -d "data" ]; then
            # Cleanly move to data_processing to lock the public frontend
            mv data data_processing
            
            git add .
            git commit -m "chore(pipeline): lock frontend for nightly processing [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
            echo "Frontend locked."
          else
            echo "System already locked."
          fi

  pull-urls:
    name: Node A · Pull New URLs
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Run Crawler
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pull_new_urls.py
      - name: Upload Pull Results
        uses: actions/upload-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/*.json

  push-annotations:
    name: Node B · Push Annotations to HF
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Merge to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/merge_annotations_to_hf.py

  sync-and-unlock:
    name: Stage 04-05 · Sync & Unlock
    needs: [pull-urls, push-annotations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
        uses: actions/download-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/
      - name: Sync templates and Unlock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 0. Pull latest changes (--autostash handles the downloaded artifact files)
          git pull origin main --rebase --autostash

          # 1. Reset annotations folder with latest images
          python -c '
          import json, os, glob, shutil
          from pathlib import Path
          for src_path in glob.glob("data_processing/*.json"):
              with open(src_path, "r") as f:
                  data = json.load(f)
              for record in data:
                  record["user_label"] = None
                  record["locations"] = []
              dest_path = Path("annotations") / os.path.basename(src_path)
              with open(dest_path, "w") as f:
                  json.dump(data, f, indent=2)
          '
          
          # 2. Unlock system (Rename processing -> data)
          if [ -d "data_processing" ]; then
            if [ -d "data" ]; then
              echo "::error::Both data/ and data_processing/ exist simultaneously — inconsistent state."
              exit 1
            fi
            mv data_processing data
          fi
          
          # 3. Final Consolidated Commit
          git add data/ annotations/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(pipeline): refresh task database and clean templates [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi
