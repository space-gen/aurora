name: "Nightly Pipeline"

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC daily
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pipeline:
    name: Continuous Solar Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests huggingface_hub datasets

      - name: Stage 01 · Lock
        run: |
          if [ -d "data" ]; then
            mv data data_processing
            echo "Locked: data/ moved to data_processing/"
          fi

      - name: Stage 02 · Pull New URLs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pull_new_urls.py

      - name: Stage 03 · Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/merge_annotations_to_hf.py

      - name: Stage 04 · Sync Templates
        run: |
          python -c '
          import json, os, glob
          from pathlib import Path
          for src_path in glob.glob("data_processing/*.json"):
              with open(src_path, "r") as f:
                  data = json.load(f)
              for record in data:
                  record["user_label"] = None
                  record["locations"] = []
              dest_path = Path("annotations") / os.path.basename(src_path)
              with open(dest_path, "w") as f:
                  json.dump(data, f, indent=2)
          '

      - name: Stage 05 · Unlock
        run: |
          if [ -d "data_processing" ]; then
            mv data_processing data
            echo "Unlocked: data_processing/ moved back to data/"
          fi

      - name: Final Consolidated Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ annotations/
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(pipeline): nightly data refresh and template sync [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi
