name: "Nightly Pipeline"
concurrency:
  group: aurora-nightly
  cancel-in-progress: false

on:
  repository_dispatch: 
   types: [cronjob] # 00:00 UTC daily
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lock:
    name: Stage 01 · Lock Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename data/ to data_processing/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Safety: data/ and data_processing/ must never coexist
          if [ -d "data" ] && [ -d "data_processing" ]; then
            echo "::error::Both data/ and data_processing/ exist simultaneously — inconsistent repository state. Manual intervention required."
            exit 1
          fi

          if [ -d "data" ]; then
            # Cleanly move to data_processing to lock the public frontend
            mv data data_processing
            
            git add .
            git commit -m "chore(pipeline): lock frontend for nightly processing [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
            echo "Frontend locked."
          else
            echo "System already locked."
          fi

  pull-urls:
    name: Stage 2 · Pull New URLs
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Run Crawler
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pull_new_urls.py
      - name: Upload Pull Results
        uses: actions/upload-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/*.jsonl

  push-annotations:
    name: Stage 3 · Push Annotations to HF
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Merge to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/merge_annotations_to_hf.py

  sync-and-unlock:
    name: Stage 04-05 · Sync & Unlock
    needs: [pull-urls, push-annotations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Download Pulled Data
        uses: actions/download-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/
      - name: Sync templates and Unlock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 0. Pull latest changes (--autostash handles the downloaded artifact files)
          git pull origin main --rebase --autostash

          # 1. Reset annotations folder with latest images
          python -c '
          import os, glob, shutil
          from pathlib import Path

          # Clean annotations/ but keep README.md
          for p in glob.glob("annotations/*"):
              if os.path.basename(p) == "README.md": continue
              if os.path.isfile(p): os.remove(p)
              elif os.path.isdir(p): shutil.rmtree(p)

          # Direct clone from data_processing to annotations
          for src_path in glob.glob("data_processing/*.jsonl"):
              dest_path = Path("annotations") / os.path.basename(src_path)
              shutil.copy2(src_path, dest_path)
          '          
          # 2. Unlock system (Rename processing -> data)
          if [ -d "data_processing" ]; then
            if [ -d "data" ]; then
              echo "::error::Both data/ and data_processing/ exist simultaneously — inconsistent state."
              exit 1
            fi
            mv data_processing data
          fi
          
          # 3. Final Consolidated Commit
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(pipeline): refresh task database and clean templates [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi

  unlock-on-failure:
    name: Stage 99 · Unlock on Failure
    if: ${{ failure() }}
    needs: [lock, pull-urls, push-annotations, sync-and-unlock]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Recover to unlocked state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

          # Ensure the idle repository keeps only data/
          if [ -d "data" ] && [ -d "data_processing" ]; then
            rm -rf data_processing
            echo "Removed stale data_processing/."
          elif [ ! -d "data" ] && [ -d "data_processing" ]; then
            mv data_processing data
            echo "Recovered data/ from locked state."
          else
            echo "No unlock recovery needed."
          fi

          git add -A .
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
          else
            git commit -m "chore(pipeline): recover unlocked state after failure [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi
