name: "Nightly Pipeline"
concurrency:
  group: aurora-nightly
  cancel-in-progress: false

on:
  repository_dispatch: 
    types: nightly refresh
   # 00:00 UTC daily
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lock:
    name: Stage 01 · Lock Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename data/ to data_processing/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Safety: if both data/ and data_processing/ exist, attempt a safe merge to avoid manual intervention.
          if [ -d "data" ] && [ -d "data_processing" ]; then
            echo "::warning::Both data/ and data_processing/ exist — attempting safe merge of data -> data_processing."
            # Merge new files from data into data_processing without overwriting existing files in data_processing.
            # Use rsync for a safe, idempotent merge.
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --ignore-existing data/ data_processing/ || true
            else
              # Portable fallback: copy files that don't already exist
              mkdir -p data_processing
              for f in data/*; do
                bn=$(basename "$f")
                if [ ! -e "data_processing/$bn" ]; then
                  cp -r "data/$bn" "data_processing/" || true
                fi
              done
            fi
            # After merging, remove the old data/ directory to restore expected state.
            rm -rf data || true
            echo "Merged data/ into data_processing/ and removed data/ to recover pipeline state."
          fi

          if [ -d "data" ]; then
            # Cleanly move to data_processing to lock the public frontend
            mv data data_processing
            
            # Prepare orphan 'data' branch and commit only data files
            # copy data_processing to temp to avoid polluting main
            mkdir -p /tmp/data_pipeline || true
            cp -r data_processing /tmp/data_pipeline/ || true

            # Create orphan branch 'data' (delete local if exists)
            if git rev-parse --verify data >/dev/null 2>&1; then
              git branch -D data || true
            fi
            git checkout --orphan data

            # Clear index and working tree for a clean branch
            git rm -rf --quiet . || true

            # Populate only the data files
            mkdir -p data
            if [ -d "/tmp/data_pipeline/data_processing" ]; then
              cp -r /tmp/data_pipeline/data_processing/* data/ || true
            fi

            git add -f data || true
            if git diff --cached --quiet; then
              echo "No data changes to commit."
            else
              git commit -m "chore(data): update dataset [skip ci]

              Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
              git push --force origin data
            fi

            # Return to main branch (clean workspace)
            git checkout main || true
            git reset --hard origin/main || true
            echo "Frontend locked."
          else
            echo "System already locked."
          fi

  pull-urls:
    name: Stage 2 · Pull New URLs
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Run Crawler
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pull_new_urls.py
      - name: Upload Pull Results
        uses: actions/upload-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/*.jsonl

  push-annotations:
    name: Stage 3 · Push Annotations to HF
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests huggingface_hub datasets
      - name: Merge to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Running HF merge script (daily). Script will upload daily files and perform full merge on UTC 1st."
          python scripts/merge_annotations_to_hf.py

      - name: Monthly HF history squash (1st of month)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Use UTC date; run only on the 1st day of the month
          if [ "$(date -u +%d)" = "01" ]; then
            echo "1st of month detected (UTC): running HF history squash"
            python scripts/squash_history.py
          else
            echo "Not the 1st of the month (UTC); skipping HF history squash."
          fi

  sync-and-unlock:
    name: Stage 04-05 · Sync & Unlock
    needs: [pull-urls, push-annotations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Download Pulled Data
        uses: actions/download-artifact@v4
        with:
          name: fresh-task-data
          path: data_processing/
      - name: Sync templates and Unlock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 0. Pull latest changes (--autostash handles the downloaded artifact files)
          git pull origin main --rebase --autostash

          # 1. Reset annotations folder with latest images
          # Ensure annotations directory exists (repo may not contain it on main)
          mkdir -p annotations
          python -c '
          import json, os, glob, shutil
          from pathlib import Path

          # Clean annotations/ but keep README.md
          for p in glob.glob("annotations/*"):
              if os.path.basename(p) == "README.md": continue
              if os.path.isfile(p): os.remove(p)
              elif os.path.isdir(p): shutil.rmtree(p)

          # Direct clone from data_processing to annotations with enforced order
          for src_path in glob.glob("data_processing/*.jsonl"):
              dest_path = Path("annotations") / os.path.basename(src_path)
              # Ensure parent dir exists
              dest_path.parent.mkdir(parents=True, exist_ok=True)
              with open(src_path, "r", encoding="utf-8") as fin, open(dest_path, "w", encoding="utf-8") as fout:
                  for line in fin:
                      if not line.strip(): continue
                      record = json.loads(line)
                      
                      # Enforce field order
                      ordered_record = {
                          "id": record.get("id"),
                          "url": record.get("url"),
                          "task_type": record.get("task_type"),
                          "created_at": record.get("created_at"),
                          "metadata": record.get("metadata", {}),
                          "annotations": [] # Reset for new template
                      }
                      
                      fout.write(json.dumps(ordered_record, separators=(",", ":")) + "\n")
          '          
          # 2. Unlock system (Rename processing -> data)
          if [ -d "data_processing" ]; then
            if [ -d "data" ]; then
              echo "::warning::Both data/ and data_processing/ exist — attempting safe merge of data_processing -> data."
              if command -v rsync >/dev/null 2>&1; then
                rsync -a --ignore-existing data_processing/ data/ || true
              else
                mkdir -p data
                for f in data_processing/*; do
                  bn=$(basename "$f")
                  if [ ! -e "data/$bn" ]; then
                    cp -r "data_processing/$bn" "data/" || true
                  fi
                done
              fi
              rm -rf data_processing || true
            else
              mv data_processing data
            fi
          fi
          
          # 3. Final Consolidated Commit
          # 3. Final Consolidated Commit
          # Temporarily move data out of working tree so it won't be committed to main
          if [ -d "data" ]; then
            mkdir -p /tmp/data_pipeline
            mv data /tmp/data_pipeline/data
          fi
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(pipeline): refresh task database and clean templates [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push origin main
          fi

          # 4. Publish data to orphan 'data' branch with no history
          if [ -d "/tmp/data_pipeline/data" ]; then
            if git rev-parse --verify data >/dev/null 2>&1; then
              git branch -D data || true
            fi
            git checkout --orphan data
            git rm -rf --quiet . || true
            mkdir -p data
            cp -r /tmp/data_pipeline/data/* data/ || true
            git add -f data || true
            if git diff --cached --quiet; then
              echo "No data changes to commit."
            else
              git commit -m "chore(data): refresh dataset [skip ci]

              Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
              git push --force origin data
            fi
            git checkout main || true
            git reset --hard origin/main || true
          fi

          # cleanup temp
          rm -rf /tmp/data_pipeline || true
