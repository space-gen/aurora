name: "Setup Platforms"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm one-time platform initialisation"
        required: true
        default: ""

jobs:
  setup:
    name: Initialise HuggingFace and Kaggle resources
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datasets huggingface_hub kaggle

      - name: Run platform setup
        env:
          # Add these secrets under Settings → Secrets and variables → Actions.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/setup_platforms.py
