name: "08 · Unlock Frontend"

on:
  workflow_run:
    workflows: ["07 · Evaluate Model Accuracy"]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unlock-frontend:
    name: Rename data_processing/ → data/
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename data_processing/ back to data/
        run: |
          if [ -d "data_processing" ]; then
            git mv data_processing data
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(pipeline): unlock — rename data_processing/ to data/ [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
            echo "System unlocked: data_processing/ renamed to data/"
          elif [ -d "data" ]; then
            echo "data/ already exists — system may already be unlocked."
          else
            echo "ERROR: Neither data/ nor data_processing/ found." >&2
            exit 1
          fi
