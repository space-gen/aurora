name: "Parse Annotation"

concurrency:
  group: aurora-data
  cancel-in-progress: false

on:
  schedule:
    - cron: "40 23 * * *"
  repository_dispatch:
    types: [parse_annotation, "annotation update"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  process-all-annotations:
    name: Process all open annotation issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout main for scripts
        uses: actions/checkout@v4

      - name: Checkout private annotations
        uses: actions/checkout@v4
        with:
          repository: space-gen/aurora-annotations
          token: ${{ secrets.ANNOTATIONS_TOKEN }}
          path: private

      - name: Add today's task records
        run: |
          git fetch origin data
          git checkout origin/data -- annotations
          python scripts/private_annotations.py seed annotations private/annotations
          git -C private config user.name "github-actions[bot]"
          git -C private config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run processor for all annotation issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_DELETE_TOKEN: ${{ secrets.ANNOTATIONS_TOKEN }}
          ANNOTATIONS_DIR: private/annotations
        run: python scripts/process_all_annotation_issues.py
