name: "Parse Annotation"

on:
  repository_dispatch:
    types: [parse_annotation, "annotation update"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  process-all-annotations:
    name: Process all open annotation issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data           # Target branch for annotations
          fetch-depth: 0      # Get full history to avoid push rejections
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Load scripts from main
        run: |
          # Fetch main so we can grab the parser and processor
          git fetch origin main
          git checkout origin/main -- scripts/
          # Ensure annotations directory exists on the data branch
          mkdir -p annotations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run processor for all annotation issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # The script will now run on the 'data' branch context
          python scripts/process_all_annotation_issues.py
