name: "Parse Annotation"

on:
  repository_dispatch:
    types: [parse_annotation, "annotation update"]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
      issue_body:
        description: 'Issue body (full markdown)'
        required: true
      issue_author:
        description: 'Issue author (username)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  parse-annotation:
    name: Parse annotation issue and write to annotations/
    runs-on: ubuntu-latest
    # Triggered via repository_dispatch by the issue router workflow after validation.
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse issue body into annotation JSON
        env:
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
          ISSUE_BODY: ${{ github.event.client_payload.issue_body || github.event.inputs.issue_body }}
          ISSUE_AUTHOR: ${{ github.event.client_payload.issue_author || github.event.inputs.issue_author }}
        run: python scripts/parse_issue_annotation.py

      - name: Commit annotation file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add annotations/
          if git diff --cached --quiet; then
            echo "No annotation changes to commit (possibly a duplicate)."
          else
            git commit -m "chore(annotation): record annotation from issues [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
          fi

      - name: Acknowledge and close issue
        uses: actions/github-script@v7
        with:
          script: |
            // Add acknowledgment comment and close the original issues
            const payload = context.payload.client_payload || {};
            const issue_number = payload.issue_number;
            if (!issue_number) {
              console.log('No issue_number in client_payload; skipping acknowledgment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: "✅ **Annotation recorded!** Thank you for contributing to SolarHub.\n\nYour label has been saved and will be merged into the master HuggingFace dataset during the next automated pipeline run.",
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                labels: ['recorded']
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

  process-all-annotations:
    name: Process all open annotation issues
    runs-on: ubuntu-latest
    # Only run when repository_dispatch includes a client_payload.process_all flag
    if: ${{ github.event.client_payload.process_all == 'true' }}
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run processor for all annotation issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/process_all_annotation_issues.py
