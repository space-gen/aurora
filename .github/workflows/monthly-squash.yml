name: Monthly Data Squash

on:
  repository_dispatch:
    types: [monthly_squash]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monthly-squash:
    name: Squash last 30 days into one commit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Squash monthly commits
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="main"

          # Ensure we have the latest remote state.
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          # Find the most recent commit at or before 30 days ago.
          BASE_COMMIT="$(git rev-list -1 --before='30 days ago' "origin/$BRANCH")"

          if [ -z "$BASE_COMMIT" ]; then
            echo "ERROR: Could not find a commit from 30 days ago (or earlier)."
            echo "Aborting to avoid unintended history rewrite."
            exit 1
          fi

          HEAD_COMMIT="$(git rev-parse HEAD)"
          COMMITS_TO_SQUASH="$(git rev-list --count "$BASE_COMMIT..$HEAD_COMMIT")"

          if [ "$COMMITS_TO_SQUASH" -eq 0 ]; then
            echo "No new commits in the last 30 days to squash. Exiting safely."
            exit 0
          fi

          echo "Base commit: $BASE_COMMIT"
          echo "Head commit: $HEAD_COMMIT"
          echo "Commits to squash: $COMMITS_TO_SQUASH"

          # Stage all changes introduced since BASE_COMMIT.
          git reset --soft "$BASE_COMMIT"

          # Create one consolidated commit.
          git commit -m "Monthly SolarHub Data Consolidation [Auto]"

          # Rewrite main branch history with the monthly squashed commit.
          git push --force origin "$BRANCH"
