name: "Setup Kaggle"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm Kaggle kernel initialisation"
        required: true
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup-kaggle:
    name: Initialise Kaggle Kernels
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle and Inject Tokens
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Inject secrets into both task kernels
          for task in sunspot magnetogram; do
            sed -i "s|__HF_TOKEN_PLACEHOLDER__|${HF_TOKEN}|g" .github/kaggle/$task/train.py
            sed -i "s|__GH_TOKEN_PLACEHOLDER__|${GH_TOKEN}|g" .github/kaggle/$task/train.py
          done
          
          # Configure Kaggle CLI
          mkdir -p ~/.kaggle
          echo "{\"username\":\"soumyadipkarforma\",\"key\":\"$KAGGLE_API_TOKEN\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Push Task Kernels
        run: |
          kaggle kernels push --path .github/kaggle/sunspot/
          sleep 10
          kaggle kernels push --path .github/kaggle/magnetogram/
