name: "Setup Kaggle"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm Kaggle kernel initialisation"
        required: true
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup-kaggle:
    name: Initialise Kaggle Kernels
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Kaggle CLI version 2.0+ supports KAGGLE_API_TOKEN directly.
          # No need to write kaggle.json manually if the env var is set.
          echo "Kaggle configured via KAGGLE_API_TOKEN"

      - name: Initialise Training Kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push --path .github/kaggle/training/
          # Wait a bit for Kaggle to process
          sleep 10

      - name: Initialise Inference Kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push --path .github/kaggle/inference/
