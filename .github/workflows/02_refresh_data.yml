name: "02 · Refresh Data"

on:
  workflow_run:
    workflows: ["01 · Lock & Prepare"]
    types: [completed]
  workflow_dispatch:

jobs:
  refresh-data:
    name: Pull new solar-observation URLs
    runs-on: ubuntu-latest
    # Only run if the previous stage succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests huggingface_hub datasets

      - name: Pull new URLs
        env:
          # HF_TOKEN is used by pull_new_urls.py to check for duplicate URLs
          # already present in the HuggingFace dataset.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pull_new_urls.py

      - name: Commit new task files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_processing/
          if git diff --cached --quiet; then
            echo "No new task files to commit."
          else
            git commit -m "chore(pipeline): refresh — add new task URLs [skip ci]"
            git push
          fi
