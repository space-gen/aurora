name: "07 · Evaluate Model Accuracy"

on:
  workflow_run:
    workflows: ["06 · Trigger Kaggle Inference"]
    types: [completed]
  workflow_dispatch:

jobs:
  evaluate-accuracy:
    name: Evaluate model accuracy against user annotations
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate model accuracy
        # compute_points.py reads only local files; no external API secrets needed.
        run: python scripts/compute_points.py

      - name: Commit model accuracy report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_processing/
          if git diff --cached --quiet; then
            echo "No accuracy changes to commit."
          else
            git commit -m "chore(pipeline): update model accuracy report [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
          fi
