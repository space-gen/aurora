name: "00 · Parse Annotation Issue"

on:
  issues:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  parse-annotation:
    name: Parse annotation issue and write to annotations/
    runs-on: ubuntu-latest
    # Only act on issues that have the 'annotation' label applied.
    if: github.event.label.name == 'annotation'
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse issue body into annotation JSON
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python scripts/parse_issue_annotation.py

      - name: Commit annotation file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add annotations/
          if git diff --cached --quiet; then
            echo "No annotation changes to commit (possibly a duplicate)."
          else
            git commit -m "chore(annotation): record annotation from issue #${{ github.event.issue.number }} [skip ci]

            Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
          fi

      - name: Acknowledge and close issue
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Add acknowledgment comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ **Annotation recorded!** Thank you for contributing to SolarHub.\n\nYour label has been saved and will be merged into the master HuggingFace dataset during the next automated pipeline run.",
            });

            // 2. Add 'recorded' label and remove 'annotation' label if desired
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['recorded']
            });

            // 3. Close the issue to keep the tracker clean
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
