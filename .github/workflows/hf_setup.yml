name: "HF Platform Cleanup"

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Space-separated task types to clean (e.g. sunspot magnetogram cme). REQUIRED."
        required: true
        default: ""
      confirm:
        description: "Type 'yes' to confirm PURGE of existing HF data for these tasks"
        required: true
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  production-cleanup:
    name: Purge Dataset Records
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Run Platform Cleanup
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_setup.py ${{ github.event.inputs.tasks }}
