name: "HF Platform Setup"

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Space-separated task types to reset (e.g. sunspot magnetogram cme). Defaults to sunspot magnetogram."
        required: false
        default: "sunspot magnetogram"
      confirm:
        description: "Type 'yes' to confirm DELETION of existing HF data for these tasks"
        required: true
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  production-setup:
    name: Purge and Reset HuggingFace Datasets
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Run Platform Setup
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_setup.py ${{ github.event.inputs.tasks }}
