name: "06 · Trigger Kaggle Inference"

on:
  workflow_dispatch:

jobs:
  trigger-inference:
    name: Trigger Kaggle daily inference kernel
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Trigger inference kernel
        env:
          # KAGGLE_KEY authenticates the Kaggle API call via KAGGLE_API_TOKEN.
          # The inference kernel itself uses a GH_TOKEN Kaggle Secret to push
          # predictions.json back to this GitHub repository.
          # Set these secrets under Settings → Secrets and variables → Actions.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Trigger the inference kernel.  The kernel will:
          #   1. Pull the latest model from HuggingFace (SpaceGen/solarhub-model-{task_type})
          #      using its HF_TOKEN Kaggle Secret.
          #   2. Read task URLs from HuggingFace (SpaceGen/solarhub-{task_type}, tasks split).
          #   3. Run inference and produce predictions.json as a kernel output file.
          kaggle kernels push \
            --path .github/kaggle/inference/ \
            || echo "Kernel push attempted — check Kaggle for run status."
