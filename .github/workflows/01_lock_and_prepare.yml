name: "01 · Lock & Prepare"

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC nightly
  workflow_dispatch:        # Allow manual trigger

jobs:
  lock-and-prepare:
    name: Rename data/ → data_processing/
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename data/ to data_processing/
        run: |
          if [ -d "data" ]; then
            git mv data data_processing
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(pipeline): lock — rename data/ to data_processing/ [skip ci]

Co-authored-by: soumyadipkarforma <soumyadipkarforma@gmail.com>"
            git push
            echo "System locked: data/ renamed to data_processing/"
          elif [ -d "data_processing" ]; then
            echo "data_processing/ already exists — pipeline may already be locked."
          else
            echo "ERROR: Neither data/ nor data_processing/ found." >&2
            exit 1
          fi
