name: Yearly Fresh Start

on:
  repository_dispatch:
    types: [yearly_cleanup]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  yearly-fresh-start:
    name: Reset history to a single yearly archive commit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Actions bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pre-check repository size (before cleanup)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BEFORE CLEANUP: .git directory size ==="
          du -sh .git || true
          echo "=== BEFORE CLEANUP: git object statistics ==="
          git count-objects -vH || true

      - name: Create orphan branch and rebuild main
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_YEAR="$(date +%Y)"

          # Ensure local data branch matches remote data before rewriting history.
          git fetch origin data || true
          # If data doesn't exist remotely yet, initialize it from current working tree
          if ! git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout --orphan temp-fresh-start || true
            git rm -rf --cached . >/dev/null 2>&1 || true
            git add -A || true
            git commit -m "Initialize data branch for yearly archive" || true
            git branch -M data || true
            git push --force origin data || true
            git checkout -f main || true
          fi

          # Checkout data branch and reset to remote
          git checkout data
          git reset --hard origin/data

          # Create an orphan branch with no history for the archive snapshot
          if ! git checkout --orphan temp-fresh-start; then
            echo "ERROR: Failed to create/switch to orphan branch 'temp-fresh-start'."
            exit 1
          fi

          # Clear index/worktree tracking, then add current repository state.
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -A

          # Commit current snapshot as yearly archive baseline.
          git commit -m "SolarHub Aurora: Annual Fresh Start [Archive Year ${ARCHIVE_YEAR}]"

          # Replace data branch with orphan snapshot.
          git branch -M data

      - name: Post-check repository size (after cleanup prep)
        shell: bash
        run: |
          set -euo pipefail
          # Expire reflogs and aggressively prune unreachable objects so size comparison is meaningful.
          git reflog expire --expire=now --all || true
          git gc --prune=now --aggressive || true

          echo "=== AFTER CLEANUP PREP: .git directory size ==="
          du -sh .git || true
          echo "=== AFTER CLEANUP PREP: git object statistics ==="
          git count-objects -vH || true

      - name: Force push rewritten main
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin main
