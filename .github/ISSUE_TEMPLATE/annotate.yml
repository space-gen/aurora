body:
- attributes:
    value: '## Annotate a Solar Observation


      Fill in the fields below to submit your annotation. Your label will be used to train and evaluate the SolarHub solar-classification model.


      **Scientific Classification Labels:**


      | Task Type | Valid Labels (Scientific System) |

      |-----------|----------------------------------|

      | `sunspot` | `class_a`, `class_b`, `class_c`, `class_d`, `class_e`, `class_f`, `class_h`, `none` |

      | `magnetogram` | `alpha`, `beta`, `gamma`, `beta-gamma`, `delta`, `beta-delta`, `beta-gamma-delta`, `gamma-delta`, `none` |'
  type: markdown
- attributes:
    description: The full HTTPS URL of the solar observation image you are labelling.
    label: Image URL
    placeholder: https://solar-data-source/image.jpg
  id: image_url
  type: input
  validations:
    required: true
- attributes:
    description: The type of solar observation task.
    label: Task Type
    options:
    - sunspot
    - magnetogram
  id: task_type
  type: dropdown
  validations:
    required: true
- attributes:
    description: The unique ID of this record (e.g. sp-123). Found in the task JSON.
    label: Record ID
  id: record_id
  type: input
  validations:
    required: true
- attributes:
    description: 'Specify one or more labeled regions using the format `label,rle`. Separate multiple regions with a semicolon (`;`).

      Example: `class_a,10 1 5 2 3 ; class_h,2 7 1 4`.

      Labels must be valid for the selected Task Type (see table above). RLE (run-length encoding) should be provided as a space-separated sequence of start/length pairs or another accepted RLE string representing the mask for that annotation.
      '
    label: Your Label (label,x,y,r ; label2,x2,y2,r2)
    placeholder: e.g. class_a,100,150,32 ; class_f,200,50,50
  id: your_label
  type: input
  validations:
    required: true
- attributes:
    description: How confident are you in these annotations? (0 = Not sure, 100 = Absolutely certain)
    label: Confidence Score (0-100)
    placeholder: e.g. 95
  id: confidence_score
  type: input
  validations:
    required: true
- attributes:
    description: Any additional observations or comments about this image.
    label: Notes (optional)
    placeholder: Optional notes...
  id: notes
  type: textarea
  validations:
    required: false
description: Label a solar observation image for the SolarHub citizen-science dataset.
labels:
- annotation
name: Submit Solar Observation Annotation
