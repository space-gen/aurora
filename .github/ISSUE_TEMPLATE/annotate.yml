name: "Submit Solar Observation Annotation"
description: "Label a solar observation image for the SolarHub citizen-science dataset."
labels:
  - annotation
body:
  - type: markdown
    attributes:
      value: |
        ## Annotate a Solar Observation

        Fill in the fields below to submit your annotation.  Your label will be
        used to train and evaluate the SolarHub solar-classification model.

        **Scientific & Descriptive Classification Labels:**
        | Task Type | Scientific System | Descriptive States (Aliases) |
        |-----------|-------------------|-----------------------------|
        | `sunspot` | McIntosh (`class_a` - `class_h`) | `quiet_sun`, `single_spot`, `spot_cluster` |
        | `solar_flare` | GOES (`x_class` - `a_class`) | `no_flare`, `microflare`, `flare_region` |
        | `magnetogram` | Mount Wilson (`alpha` - `delta`) | `quiet`, `bipolar_region`, `complex_magnetic` |
        | `coronal_hole`| Heliographic (`polar`, `equatorial`) | `calm_region`, `isolated_hole` |
        | `prominence`  | Stability (`quiescent`, `active`) | `no_prominence`, `filament`, `prominence_loop` |
        | `cme`         | CDAW (`full_halo`, `partial_halo`) | `quiet_corona`, `jet`, `streamer_blowout` |

  - type: input
    id: image_url
    attributes:
      label: "Image URL"
      description: "The full HTTPS URL of the solar observation image you are labelling."
      placeholder: "https://solar-data-source/image.jpg"
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: "Task Type"
      description: "The type of solar observation task."
      options:
        - sunspot
        - solar_flare
        - magnetogram
        - coronal_hole
        - prominence
        - active_region
        - cme
    validations:
      required: true

  - type: input
    id: record_id
    attributes:
      label: "Record ID"
      description: "The unique ID of this record (e.g. sp-123). Found in the task JSON."
    validations:
      required: true

  - type: input
    id: serial_number
    attributes:
      label: "Serial Number"
      description: "The serial number of this record. Found in the task JSON."
    validations:
      required: true

  - type: input
    id: user_label
    attributes:
      label: "Your Label"
      description: "Your classification for this image (see the table above for valid values)."
      placeholder: "e.g. active_region"
    validations:
      required: true

  - type: input
    id: coordinates
    attributes:
      label: "Pixel Coordinates (optional)"
      description: "The (x, y) or (x, y, radius) location of the feature. Multiple features separated by semicolon."
      placeholder: "e.g. 450,320,15 ; 890,110,10"
    validations:
      required: false


  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Any additional observations or comments about this image."
      placeholder: "Optional notes..."
    validations:
      required: false
