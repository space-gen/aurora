name: "Submit Solar Observation Annotation"
description: "Label a solar observation image for the SolarHub citizen-science dataset."
labels:
  - annotation
body:
  - type: markdown
    attributes:
      value: |
        ## Annotate a Solar Observation

        Fill in the fields below to submit your annotation.  Your label will be
        used to train and evaluate the SolarHub solar-classification model.

        **Scientific Classification Labels:**
        | Task Type | Valid Labels (Scientific Standard) |
        |-----------|-------------|
        | `sunspot` | `class_a` · `class_b` · `class_c` · `class_d` · `class_e` · `class_f` · `class_h` (McIntosh/Zurich) |
        | `solar_flare` | `x_class` · `m_class` · `c_class` · `b_class` · `a_class` (GOES X-ray) |
        | `magnetogram` | `alpha` · `beta` · `gamma` · `beta-gamma` · `delta` · `beta-gamma-delta` (Mount Wilson) |
        | `coronal_hole`| `polar` · `equatorial` · `mid-latitude` · `transequatorial` |
        | `prominence`  | `quiescent` · `active` · `eruptive` · `intermediate` |
        | `cme`         | `full_halo` · `partial_halo` · `normal` · `narrow` (CDAW) |

  - type: input
    id: image_url
    attributes:
      label: "Image URL"
      description: "The full HTTPS URL of the solar observation image you are labelling."
      placeholder: "https://solar-data-source/image.jpg"
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: "Task Type"
      description: "The type of solar observation task."
      options:
        - sunspot
        - solar_flare
        - magnetogram
        - coronal_hole
        - prominence
        - active_region
        - cme
    validations:
      required: true

  - type: input
    id: record_id
    attributes:
      label: "Record ID"
      description: "The unique ID of this record (e.g. sp-123). Found in the task JSON."
    validations:
      required: true

  - type: input
    id: serial_number
    attributes:
      label: "Serial Number"
      description: "The serial number of this record. Found in the task JSON."
    validations:
      required: true

  - type: input
    id: user_label
    attributes:
      label: "Your Label"
      description: "Your classification for this image (see the table above for valid values)."
      placeholder: "e.g. active_region"
    validations:
      required: true

  - type: input
    id: coordinates
    attributes:
      label: "Pixel Coordinates (optional)"
      description: "The (x, y) or (x, y, radius) location of the feature. Multiple features separated by semicolon."
      placeholder: "e.g. 450,320,15 ; 890,110,10"
    validations:
      required: false


  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Any additional observations or comments about this image."
      placeholder: "Optional notes..."
    validations:
      required: false
