body:
- type: markdown
  attributes:
    value: "## Annotate a Solar Observation\n\nFill in the fields below to submit your annotation. Your label will be used to train and evaluate the SolarHub solar-classification model.\n\n**Scientific Classification Labels:**\n\n| Task Type | Scientific System |\n|-----------|-------------------|\n| `sunspot` | McIntosh (`class_a` - `class_h`) |\n| `solar_flare` | GOES (`x_class` - `a_class`) |\n| `magnetogram` | Mount Wilson (`alpha` - `delta`) |\n| `coronal_hole`| Heliographic (`polar`, `equatorial`) |\n| `prominence`  | Stability (`quiescent`, `active`) |\n| `cme`         | CDAW (`full_halo`, `partial_halo`) |"
- type: input
  id: image_url
  attributes:
    label: Image URL
    description: The full HTTPS URL of the solar observation image you are labelling.
    placeholder: https://solar-data-source/image.jpg
  validations:
    required: true
- type: dropdown
  id: task_type
  attributes:
    label: Task Type
    description: The type of solar observation task.
    options:
      - sunspot
      - solar_flare
      - magnetogram
      - coronal_hole
      - prominence
      - active_region
      - cme
  validations:
    required: true
- type: input
  id: record_id
  attributes:
    label: Record ID
    description: The unique ID of this record (e.g. sp-123). Found in the task JSON.
  validations:
    required: true
- type: input
  id: serial_number
  attributes:
    label: Serial Number
    description: The serial number of this record. Found in the task JSON.
  validations:
    required: true
- type: textarea
  id: regions
  attributes:
    label: Regions (label,x,y,r ; label2,x2,y2,r2)
    description: |
      Specify one or more labeled regions using the format `label,x,y,r`. Separate multiple regions with a semicolon (`;`).
      Example: `class_a,450,320,15 ; class_h,890,110,10`.
      Labels must be valid for the selected Task Type (see table above). Coordinates may be integers or floats. Radius is optional; omit or set to 0 for point annotations.
    placeholder: e.g. sunspot,450,320,15 ; sunspot,890,110,10
  validations:
    required: true
- type: textarea
  id: notes
  attributes:
    label: Notes (optional)
    description: Any additional observations or comments about this image.
    placeholder: Optional notes...
  validations:
    required: false
name: Submit Solar Observation Annotation
description: Label a solar observation image for the SolarHub citizen-science dataset.
labels:
  - annotation
